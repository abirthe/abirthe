<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <radialGradient id="glowLeft" cx="15%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowRight" cx="85%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <pattern id="gridDots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1" fill="#38bdf8" fill-opacity="0.2" />
    </pattern>

    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.9); }
    }
    .pulsing-beacon {
      animation: pulse 2s infinite ease-in-out;
      transform-origin: 32px 34px;
    }
    .main-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Outfit', 'Inter', Roboto, sans-serif;
      font-size: 40px;
      font-weight: 900;
      letter-spacing: -0.5px;
    }
    .sub-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
      font-size: 15.5px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
      font-size: 13px;
      font-weight: 400;
      fill: #94a3b8;
    }
    .mono-pill {
      font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.6px;
    }
    .chip-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 600;
    }
  </style>

  <!-- Base Background -->
  <rect x="2" y="2" width="896" height="216" rx="16" fill="url(#bg)" stroke="url(#borderGrad)" stroke-width="1.5" />
  <rect x="2" y="2" width="896" height="216" rx="16" fill="url(#glowLeft)" />
  <rect x="2" y="2" width="896" height="216" rx="16" fill="url(#glowRight)" />
  <rect x="2" y="2" width="896" height="216" rx="16" fill="url(#gridDots)" />

  <!-- Top Status Badge -->
  <g transform="translate(32, 22)">
    <rect x="0" y="0" width="280" height="26" rx="13" fill="#031422" stroke="#00f0ff" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="15" cy="13" r="4.5" fill="#10b981" class="pulsing-beacon" filter="url(#neonGlow)" />
    <text x="28" y="17" fill="#38bdf8" class="mono-pill">STATUS: OPEN FOR ARCHITECTURE</text>
  </g>

  <!-- Top Right Username Tag -->
  <g transform="translate(688, 22)">
    <rect x="0" y="0" width="180" height="26" rx="13" fill="#170d26" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1" />
    <text x="16" y="17" fill="#c084fc" class="mono-pill">@abirthe // SYSTEMS</text>
  </g>

  <!-- Hero Name -->
  <text x="32" y="95" fill="url(#titleGrad)" class="main-title">ABIR HOSSAIN</text>
  <text x="32" y="122" fill="url(#accentGrad)" class="sub-title">Full-Stack Architect • Autonomous Systems &amp; FinTech Solutions</text>
  <text x="32" y="148" class="tagline">Zero-defect engineering with verified MFS escrow contracts, spatial GIS, and real-time edge automation.</text>

  <!-- Feature Chips (Well-Spaced &amp; Guaranteed Not To Overflow) -->
  <g transform="translate(32, 168)">
    <!-- Chip 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="190" height="30" rx="8" fill="#061f18" stroke="#10b981" stroke-opacity="0.5" stroke-width="1" />
      <text x="12" y="19.5" fill="#34d399" class="chip-text">🌾 Precision GIS &amp; ML Yield</text>
    </g>

    <!-- Chip 2 -->
    <g transform="translate(202, 0)">
      <rect x="0" y="0" width="195" height="30" rx="8" fill="#0c192d" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1" />
      <text x="12" y="19.5" fill="#38bdf8" class="chip-text">⚡ High-Volume Commerce</text>
    </g>

    <!-- Chip 3 -->
    <g transform="translate(409, 0)">
      <rect x="0" y="0" width="195" height="30" rx="8" fill="#1b122e" stroke="#a855f7" stroke-opacity="0.5" stroke-width="1" />
      <text x="12" y="19.5" fill="#c084fc" class="chip-text">🤖 Dual Telegram AI Bot Relay</text>
    </g>

    <!-- Chip 4 -->
    <g transform="translate(616, 0)">
      <rect x="0" y="0" width="215" height="30" rx="8" fill="#20101b" stroke="#f43f5e" stroke-opacity="0.5" stroke-width="1" />
      <text x="12" y="19.5" fill="#fb7185" class="chip-text">🛡️ Default-Deny RLS &amp; 148+ Tests</text>
    </g>
  </g>
</svg>
